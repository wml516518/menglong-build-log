<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eat Card Admin</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="admin-shell">
      <header>
        <p class="eyebrow">Eat Card</p>
        <h1>Recipe Admin</h1>
      </header>

      <form id="recipeForm" class="recipe-form">
        <section aria-labelledby="accessTitle">
          <h2 id="accessTitle">Access</h2>
          <label>
            <span>Admin Token</span>
            <input id="adminToken" name="adminToken" type="password" autocomplete="off" required>
          </label>
        </section>

        <section aria-labelledby="recipeTitle">
          <h2 id="recipeTitle">Recipe</h2>
          <input name="id" type="hidden">
          <div class="grid two">
            <label>
              <span>Title</span>
              <input name="title" type="text" required>
            </label>
            <label>
              <span>Status</span>
              <select name="status">
                <option value="draft">Draft</option>
                <option value="published">Published</option>
              </select>
            </label>
          </div>

          <label>
            <span>Description</span>
            <textarea name="description" rows="3"></textarea>
          </label>

          <div class="grid three">
            <label>
              <span>Budget Cents</span>
              <input name="budgetCents" type="number" min="0" step="1" required>
            </label>
            <label>
              <span>Cook Minutes</span>
              <input name="cookMinutes" type="number" min="0" step="1" required>
            </label>
            <label>
              <span>Servings</span>
              <input name="servings" type="number" min="1" step="1" required>
            </label>
          </div>

          <div class="grid two">
            <label>
              <span>Difficulty</span>
              <select name="difficulty">
                <option value="easy">Easy</option>
                <option value="normal">Normal</option>
                <option value="hard">Hard</option>
              </select>
            </label>
            <label>
              <span>Tags</span>
              <input name="tags" type="text" placeholder="一人食,下饭">
            </label>
          </div>

          <label>
            <span>Ingredients</span>
            <textarea name="ingredients" rows="5" placeholder="肥牛卷150g&#10;番茄1个" required></textarea>
          </label>

          <label>
            <span>Steps</span>
            <textarea name="steps" rows="5" placeholder="番茄切块&#10;肥牛煮熟" required></textarea>
          </label>

          <label>
            <span>Tips</span>
            <textarea name="tips" rows="3"></textarea>
          </label>
        </section>

        <div class="actions">
          <button type="submit">Save Recipe</button>
          <p id="status" role="status" aria-live="polite"></p>
        </div>
      </form>

      <section aria-labelledby="listTitle" class="recipe-manager">
        <div class="section-heading">
          <h2 id="listTitle">Recipes</h2>
          <button id="loadRecipes" type="button">Reload</button>
        </div>

        <div class="grid three">
          <label>
            <span>Search</span>
            <input id="recipeSearch" type="search" placeholder="Title">
          </label>
          <label>
            <span>Status</span>
            <select id="recipeStatusFilter">
              <option value="">All</option>
              <option value="draft">Draft</option>
              <option value="published">Published</option>
            </select>
          </label>
          <label>
            <span>Tag</span>
            <input id="recipeTagFilter" type="text" placeholder="一人食">
          </label>
        </div>

        <div id="recipeList" class="recipe-list" aria-live="polite"></div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
