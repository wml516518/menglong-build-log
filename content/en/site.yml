projects:
  - githubUrl: 'https://github.com/wml516518/ai-passport'
    liveUrl: 'https://github.com/wml516518/ai-passport'
    stack:
      - ESP-IDF 5.5.3
      - ESP32-C3
      - LVGL
      - ES8311 / I2S
      - WebSocket
      - Python Bridge
      - Whisper
      - DeepSeek
    technicalChallenge:
      title: 'Carrying voice, UI, and pet animation without PSRAM'
      situation: The ESP32-C3 has limited internal RAM while audio capture, network streaming, LVGL rendering, and a CJK font must coexist. Button callbacks also cannot block, or capture and the UI degrade together.
      response:
        - Non-blocking button events enter the voice page; capture, playback, Wi-Fi, WebSocket, and display updates run through tasks and state machines so slow work never occupies callback threads.
        - Audio is captured in 16 kHz / 16-bit / mono chunks and streamed over WebSocket only while the key is held. A completed turn updates the pet interaction count and mascot state.
        - Leaving the page releases the screen buffer and network session before conflicting with LVGL or Wi-Fi startup; ASR text, replies, and status reach the UI through lock-protected shared caches.
    status: Introduction / Open source
    summary: 'An ESP32-C3 pet badge: a long press enters a voice page, microphone audio streams to a local bridge for ASR, LLM, and TTS, and the pet reacts to conversation state and completed interactions while showing recognized text and replies.'
    title: AI Passport ESP32 Pet Badge
  - githubUrl: 'https://github.com/wml516518/requirement-review-agent'
    liveUrl: 'https://github.com/wml516518/requirement-review-agent'
    stack:
      - React
      - PDF.js
      - Python
      - PyMuPDF
      - Mermaid
      - OpenAI Compatible
      - Render
    technicalChallenge:
      title: 'Flowchart misclassification: keep reviews grounded in the right structure'
      situation: Scanned pages, complex tables, and flows spanning pages can be mistaken for plain text. If wrong nodes or missing branches reach the model, the review evaluates a flow that does not exist or omits critical paths.
      response:
        - Detect candidate pages from text density, image blocks, lines, and color regions, then ask a vision model to reconcile screenshots, Mermaid drafts, and page text. Low-confidence findings remain clues rather than conclusions.
        - Convert ordinary pages to Markdown first and send screenshots only for critical flowcharts and tables in bounded batches. Require the model to check nodes, conditional branches, swimlanes, and exception paths so screenshots are not treated as the only source of truth.
        - Fall back from the server visual plugin to browser heuristics when the backend is unavailable, and from model review to local rules when the model fails, with the degraded mode clearly marked in the page and report.
    status: Open source
    summary: 'A multi-role reviewer for requirement documents that extracts PDF text and flowchart candidates, drafts Mermaid diagrams, and returns structured findings from product, QA, user, or custom roles.'
    title: Requirement Review Agent
  - githubUrl: 'https://github.com/wml516518/knowledgeops-rag'
    liveUrl: 'https://github.com/wml516518/knowledgeops-rag'
    stack:
      - React
      - FastAPI
      - Supabase pgvector
      - DashScope Embeddings
      - DeepSeek
      - TypeScript
    technicalChallenge:
      title: Prevent invented answers when retrieval fails
      situation: Technical documents can differ by version, use aliases, or contain similar passages. Lexical retrieval can return the wrong context, and general-knowledge completions sound credible while remaining unverifiable.
      response:
        - Preserve heading hierarchy and context boundaries during chunking, filter weak vector results with a relevance threshold, and match versioned or interface-specific facts against precise sources first.
        - Answer “insufficient information” when evidence is weak and show source passages; every answer must cite retrieved evidence instead of presenting general knowledge as knowledge-base content.
        - Build regression cases for version mismatches, synonyms, aliases, and complete misses, then track recall, answer accuracy, and unsupported-answer rate to decide whether chunking or retrieval settings need adjustment.
    status: Open source
    summary: 'A general-purpose RAG assistant for technical team knowledge bases. Documents are chunked into Supabase pgvector, with relevance filtering, cited evidence, and demo-data fallback.'
    title: KnowledgeOps RAG
  - githubUrl: 'https://github.com/wml516518/weekend-merge'
    liveUrl: 'https://weekendmerge.ailoong.net.cn'
    stack:
      - React
      - TypeScript
      - DeepSeek Function Calling
      - Node.js / SQLite
      - Cloudflare Tunnel
      - Open-Meteo
    technicalChallenge:
      title: 'Agent orchestration failure: keep plans deliverable'
      situation: A model may return an invalid structure, skip a required tool, time out, or fail upstream. Blind retries can duplicate charges, while accepting the output can violate budgets, travel constraints, or member requirements.
      response:
        - Shared Zod schemas validate model output, tool inputs, and candidate plans. Deterministic code recalculates budgets, routes, and member constraints so contract validation prevents invalid plans from reaching the UI.
        - The orchestrator bounds model turns and tool calls. The Worker persists jobs and events, so refreshes and polling never invoke the Agent twice; interrupted work is marked failed and only its owner can retry.
        - A clearly labeled rule-planner takes over when the model is unavailable, delivering a constraints-safe baseline without requesting weather data or inventing live information.
    status: Live
    summary: 'Two-person to six-person weekend negotiation AI Agent, where members independently fill in preferences; DeepSeek generates three compromise plans through controlled tool calling, and after feedback, only reorders affected segments.'
    title: Weekend Merge
  - githubUrl: 'https://github.com/wml516518/menglong-build-log'
    liveUrl: /
    stack:
      - React
      - Vite
      - TypeScript
      - Nginx
      - Cloudflare
    technicalChallenge:
      title: Keep bilingual content and static releases in sync
      situation: A CMS edit may violate the content schema, or English may become stale after Chinese changes. A failed build or upload can also leave pages, posts, and assets from different releases.
      response:
        - Zod validates the homepage and resume, while a source-content hash detects stale translations. CI blocks missing fields, obsolete English, and unsafe URLs.
        - Every release rebuilds all four site entries from source, then requires tests, a production build, and PR validation before `main` can publish.
        - Each package is published to its own versioned directory and activated atomically. A failed check restores the previous release instead of serving a mix of old and new assets.
    status: Live
    summary: A bilingual portfolio front door and public project journal.
    title: Personal Homepage + Build Log
  - githubUrl: 'https://github.com/wml516518/ai-chat-playground'
    liveUrl: /playground/
    stack:
      - React
      - FastAPI
      - Python
      - Nginx
    technicalChallenge:
      title: Keep streaming chat state trustworthy after interruptions
      situation: An SSE response can stop mid-answer, while a model request may time out, lack configuration, or emit an unparsable event. Treating partial text as complete, or showing the raw upstream error, leaves users unsure whether to wait or retry.
      response:
        - The backend keeps model credentials and maps provider failures to stable states. The frontend parses SSE event by event and appends only complete, validated events.
        - Offline, timeout, and request failures produce distinct user-facing messages. Existing conversation remains intact, the interrupted answer is marked incomplete, and retrying does not clear context.
        - The UI never exposes keys, internal URLs, or stack traces. Tests cover event order, parse failures, and error states so one failure cannot leave the page stuck in “generating.”
    status: Live
    summary: A streaming chat interface with prompt presets and a FastAPI backend layer.
    title: AI Chat Playground
