historyGalaxy:
  action: Enter the galaxy
  imageAlt: A luminous Chinese history timeline surrounded by event stars in a deep three-dimensional space
  stack:
    - Three.js
    - React Three Fiber
    - 1200 events / 200 core archives
  technicalChallenge:
    title: Keep 1,200 events responsive with reliable fallbacks
    situation: Rendering every event and label in the overview quickly exhausts the main thread and GPU. A failed search Worker, archive chunk, or WebGL initialization can also break the interactive experience.
    response:
      - Four LOD levels adapt to camera distance; a Worker-backed quadtree clusters nearby stars, while instancing keeps each frame within budget and selected, searched, or high-impact events remain visible.
      - The first load includes only the compact index. Full archives load lazily by period, and a failed chunk preserves the summary with a scoped retry instead of blocking other events.
      - Search falls back to local prefix matching when its Worker fails, and WebGL failure switches to a 2D timeline so filtering, search, stories, and archives remain available.
  status: Interactive 3D experience
  summary: 'Travel from pre-Qin times to 1949, explore 1200 sourced historical events and 200 core archives, and read the people and stories along the timeline.'
  title: History Galaxy
