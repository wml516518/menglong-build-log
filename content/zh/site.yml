historyGalaxy:
  title: 历史星河
  status: 交互式 3D 作品
  summary: 从先秦航行至 1949 年，探索 1200 个有来源的历史事件与 200 篇核心档案，在历史时间轴上阅读人物与时代故事。
  stack:
    - Three.js
    - React Three Fiber
    - 1200 个事件 / 200 篇核心档案
  technicalChallenge:
    title: 1200 个事件如何保持流畅且可降级
    situation: 总览若同时渲染全部星点和标签，会迅速压满主线程与 GPU；搜索 Worker、档案分包或 WebGL 初始化任一失败，也可能让复杂交互失效。
    response:
      - 按镜头远近设置四档 LOD，在 Worker 中用四叉树聚合相邻星点，并通过实例化绘制控制每帧预算；选中、搜索结果和重点事件始终优先保留。
      - 首屏只加载紧凑索引，完整档案按时代懒加载；分包失败时保留摘要并只重试当前档案，不阻断其他事件浏览。
      - Worker 不可用时回退到本地前缀搜索，WebGL 不可用时切换到二维时间轴，让筛选、搜索、故事和档案阅读继续工作。
  action: 进入星河
  imageAlt: 深邃三维空间中，一条发光的中国历史时间轴与众多事件星点向远方延伸
projects:
  - title: AI Passport / ESP32 宠物徽章
    status: 项目介绍 / 源码开源
    summary: 面向 ESP32-C3 的宠物徽章程序：长按进入语音页，麦克风采集推流到本地桥接服务，经 ASR、LLM 和 TTS 返回回答；宠物形象随对话状态和互动次数变化，屏幕同步显示识别文本与回复。
    stack:
      - ESP-IDF 5.5.3
      - ESP32-C3
      - LVGL
      - ES8311 / I2S
      - WebSocket
      - Python Bridge
      - Whisper
      - DeepSeek
    technicalChallenge:
      title: 无 PSRAM 设备如何承载语音、UI 与宠物动画
      situation: ESP32-C3 只有有限内部 RAM，语音采集、网络推流、LVGL 渲染和中文字库必须共存；按键回调也不能阻塞，否则采集和界面会同时受影响。
      response:
        - 用非阻塞按键事件进入语音页，采集、播放、WiFi、WebSocket 和界面刷新放在任务与状态机中推进，慢操作不占用回调线程。
        - 按 16 kHz / 16-bit / 单声道分块采集并经 WebSocket 推流，语音链路只在按键期间工作；完成一轮对话后同步宠物互动计数和形象状态。
        - 退出页面时释放屏幕缓冲和网络会话，避免与 LVGL 或 WiFi 启动争抢内存；识别文本、回复和状态经锁保护的共享缓存更新到 UI。
    githubUrl: https://github.com/wml516518/ai-passport
    liveUrl: https://github.com/wml516518/ai-passport
  - title: Requirement Review Agent / 需求评审助手
    status: 源码开源
    summary: 面向需求文档的多角色评审助手，提取 PDF 文字与流程图候选页，生成 Mermaid 草稿，并按产品、测试、用户或自定义角色输出结构化评审结论。
    stack:
      - React
      - PDF.js
      - Python
      - PyMuPDF
      - Mermaid
      - OpenAI Compatible
      - Render
    technicalChallenge:
      title: 流程图识别出错时，如何避免评审建立在错误结构上
      situation: 扫描件、复杂表格和跨页流程可能被误判成普通文本；如果把错误节点和连接交给模型，评审就会围绕一张不存在或缺失分支的流程展开。
      response:
        - 先用文字密度、图片块、线条和色块识别候选页，再让视觉模型复核截图、Mermaid 草稿与页面文字；低置信结果只作为线索，不直接进入结论。
        - 普通页优先转 Markdown，关键流程图和表格才限量发截图；模型必须核对节点、条件分支、泳道和异常路径，减少截图被当成唯一事实的风险。
        - 后端视觉插件不可用时回退到浏览器启发式算法；模型不可用时切换到本地规则评审，并在页面和报告中标明降级模式。
    githubUrl: https://github.com/wml516518/requirement-review-agent
    liveUrl: https://github.com/wml516518/requirement-review-agent
  - title: KnowledgeOps RAG / 企业知识库问答
    status: 源码开源
    summary: 面向技术团队知识库的通用 RAG 问答，文档分块后写入 pgvector，支持相关度过滤、证据引用与演示数据兜底。
    stack:
      - React
      - FastAPI
      - Supabase pgvector
      - DashScope Embeddings
      - DeepSeek
      - TypeScript
    technicalChallenge:
      title: 召回失败时，如何避免模型编造答案
      situation: 技术文档可能存在版本差异、别名或相似段落，字面检索容易召回错误上下文；如果模型用常识补齐，回答会听起来可信却无法追溯到来源。
      response:
        - 分块保留标题层级和上下文边界，向量检索后用相关度阈值过滤弱结果；版本号、接口名等关键事实优先匹配精确来源。
        - 没有足够证据时明确回答“资料不足”，并展示来源片段；回答必须引用检索结果，不把模型常识包装成知识库内容。
        - 用版本错配、同义说法、别名和无召回用例建立回归集，分别观察召回率、答案正确率与无依据回答率，再决定调整分块或检索参数。
    githubUrl: https://github.com/wml516518/knowledgeops-rag
    liveUrl: https://github.com/wml516518/knowledgeops-rag
  - title: Weekend Merge / 周末共识局
    status: 已上线
    summary: 2–6 人周末协商 Agent，成员独立填写偏好，DeepSeek 通过受控工具调用生成三套折中方案，并在否决后只重排受影响区段。
    stack:
      - React
      - TypeScript
      - DeepSeek Function Calling
      - Node.js / SQLite
      - Cloudflare Tunnel
      - Open-Meteo
    technicalChallenge:
      title: Agent 编排失败时，怎样让计划仍然可交付
      situation: 模型可能返回非法结构、漏调工具，或在超时和上游故障时中断；直接重试容易重复扣费，放任结果又可能生成超预算、交通冲突或违反成员约束的行程。
      response:
        - 用共享 Zod 契约校验模型输出、工具输入和最终方案；预算、路线与成员约束由确定性代码重新计算，非法方案不会进入候选列表。
        - Orchestrator 限制模型轮次和工具调用次数；Worker 持久化任务与事件，刷新或轮询不会重复调用 Agent，中断则明确标记失败并只允许发起人重试。
        - 模型不可用时切换到标记清楚的 rule-planner，先交付满足硬约束的基础方案，同时不请求天气、不编造实时信息。
    githubUrl: https://github.com/wml516518/weekend-merge
    liveUrl: https://weekendmerge.ailoong.net.cn
  - title: 个人主页 + 构建日志
    status: 已上线
    summary: 一个中英双语的作品入口和公开项目记录。
    stack:
      - React
      - Vite
      - TypeScript
      - Nginx
      - Cloudflare
    technicalChallenge:
      title: 双语内容与静态发布如何保持一致
      situation: CMS 编辑可能写出不符合结构的内容，中文更新后英文翻译也可能过期；如果构建或发布失败，直接覆盖线上文件还会让页面、日志和资源处在不同版本。
      response:
        - 用 Zod 校验主页与简历结构，并记录中文源内容哈希；CI 会阻止字段遗漏、翻译陈旧或 URL 不安全的发布。
        - 每次从干净内容重新构建四个站点入口，先跑测试和构建，再在 PR 中验证，最后才允许 `main` 自动发布。
        - 发布包使用独立版本目录和原子切换，保留上一版路径；检查失败时恢复旧版本，避免线上出现半套新资源。
    githubUrl: https://github.com/wml516518/menglong-build-log
    liveUrl: /
  - title: AI Chat Playground
    status: 已上线
    summary: 带 Prompt 预设和 FastAPI 后端层的流式 AI 聊天界面。
    stack:
      - React
      - FastAPI
      - Python
      - Nginx
    technicalChallenge:
      title: 流式回答中断后，怎样让状态仍可信
      situation: SSE 可能在回答中途断开，模型也可能超时、未配置或返回不可解析的事件；若把半段文本当作完成，或直接显示上游异常，用户就无法判断该等待还是重试。
      response:
        - 后端保管模型密钥并把供应商错误映射成稳定状态，前端逐事件解析 SSE，只追加已经完整收到并校验过的事件。
        - 断网、超时和请求失败分别显示可理解的中文提示，保留已有对话并把当前回答标记为未完成，重试不会清空上下文。
        - 界面不暴露密钥、内部地址或原始堆栈；测试覆盖流式顺序、解析失败和错误状态，避免一次异常让页面永久停在“生成中”。
    githubUrl: https://github.com/wml516518/ai-chat-playground
    liveUrl: /playground/
