location = /apps/history-galaxy { return 308 /apps/history-galaxy/$is_args$args; }
location = /apps/lol-rag { return 308 /apps/lol-rag/$is_args$args; }
location = /playground { return 308 /playground/$is_args$args; }

location ^~ /api/ai-chat/ {
    proxy_pass http://127.0.0.1:8001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store" always;
}

location ^~ /apps/lol-rag/api/ {
    proxy_pass http://127.0.0.1:8002/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 90s;
    add_header Cache-Control "no-store" always;
}

location ^~ /apps/history-galaxy/assets/ {
    alias /srv/portfolio/static/history/current/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location ^~ /apps/history-galaxy/ {
    alias /srv/portfolio/static/history/current/;
    index history.html;
    add_header Cache-Control "no-cache" always;
}
location ^~ /apps/lol-rag/assets/ {
    alias /srv/portfolio/static/lol-rag/current/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location ^~ /apps/lol-rag/ {
    alias /srv/portfolio/static/lol-rag/current/;
    index index.html;
    add_header Cache-Control "no-cache" always;
}
location = /apps/stockai { return 308 /apps/stockai/$is_args$args; }
location ^~ /apps/stockai/ {
    proxy_pass http://127.0.0.1:18081/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store" always;
}
location ^~ /apps/ { return 404; }
location ^~ /api/ { return 404; }
location ^~ /assets/ {
    alias /srv/portfolio/static/home/current/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location = /playground/ {
    root /srv/portfolio/static/home/current;
    try_files /index.html =404;
    add_header Cache-Control "no-cache" always;
}
location / {
    root /srv/portfolio/static/home/current;
    index index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
}
